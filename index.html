<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Agent · ailifeu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0f13;--surface:#1a1a24;--surface2:#24243a;
  --accent:#7c6af7;--accent2:#f97b6b;--green:#4ade80;
  --text:#e8e8f0;--muted:#888;--border:#2e2e44;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* ── Auth ── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:380px}
.auth-card h1{font-size:1.4rem;margin-bottom:6px}
.auth-card p{color:var(--muted);font-size:.85rem;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:.9rem;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:10px}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;transition:box-shadow .15s,border-color .15s}.btn-google:hover{border-color:#4285F4;box-shadow:0 0 0 2px rgba(66,133,244,.2)}
.btn-sm{width:auto;padding:8px 18px;font-size:.85rem}
.err{color:var(--accent2);font-size:.8rem;margin-top:10px;text-align:center;min-height:18px}

/* ── App shell ── */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:16px}
.topbar .logo{font-weight:700;font-size:1rem;color:var(--accent);flex:1}
.topbar .handle{font-size:.8rem;color:var(--muted)}
.topbar .signout{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:4px 8px;border-radius:6px}.topbar .signout:hover{color:var(--accent2)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--muted);font-size:.7rem;gap:4px;transition:color .15s}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--accent)}
.page-wrap{flex:1;overflow-y:auto;padding:20px 16px 80px;max-width:820px;margin:0 auto;width:100%}

/* ── Common ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:4px}
.card .sub{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;font-weight:600}
.tag{background:#2a2a3e;border-radius:20px;padding:3px 10px;font-size:.75rem;font-weight:600}
.tag-a{color:var(--accent)}.tag-o{color:var(--accent2)}.tag-g{color:var(--green)}
.divider{height:1px;background:var(--border);margin:16px 0}
.pill-group{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}

/* ── Score Page ── */
.score-input-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.score-input-area textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:.88rem;line-height:1.7;resize:none;min-height:140px;font-family:inherit}
.score-actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.score-result{margin-top:4px}
.score-dial{text-align:center;padding:24px 0 16px}
.score-dial .total{font-size:3.6rem;font-weight:800;line-height:1}
.score-dial .grade{font-size:1.1rem;font-weight:700;margin-top:6px}
.score-dial .grade-s{color:#f5c518}.score-dial .grade-a{color:var(--green)}.score-dial .grade-b{color:var(--accent)}.score-dial .grade-c{color:var(--accent2)}.score-dial .grade-d{color:#e05252}
.score-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-bar-label{font-size:.8rem;color:var(--muted);width:80px;flex-shrink:0}
.score-bar-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.score-bar-pts{font-size:.8rem;font-weight:700;width:40px;text-align:right;flex-shrink:0}
.score-detail{margin-top:16px}
.score-dim{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.score-dim-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.score-dim-name{font-size:.9rem;font-weight:700}
.score-dim-pts{font-size:.85rem;font-weight:700}
.score-feedback{font-size:.82rem;color:var(--muted);line-height:1.6}
.score-feedback .good{color:var(--green)}.score-feedback .warn{color:var(--accent2)}.score-feedback .bad{color:#e05252}
.score-tag-source{display:inline-block;background:#2a2a3e;border-radius:4px;padding:1px 7px;font-size:.72rem;color:var(--muted);margin:2px 2px 0 0}
.score-improve{margin-top:14px;background:#1a1a2e;border:1px solid var(--border);border-radius:10px;padding:14px}
.score-improve h4{font-size:.85rem;font-weight:700;margin-bottom:8px;color:var(--accent2)}
.score-improve li{font-size:.82rem;color:var(--text);line-height:1.7;margin-left:14px}
.score-src-badge{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.score-src-badge span{background:#2a2a3e;border-radius:20px;padding:2px 10px;font-size:.72rem;color:var(--muted)}

/* ── FB Sync ── */
.fb-card{border:1px solid #3a3560;border-radius:var(--radius);padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)}
.fb-card h3{font-size:.95rem;font-weight:700;margin-bottom:4px;color:#a78bfa}
.fb-card .sub{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.fb-steps{counter-reset:step;margin-bottom:14px}
.fb-steps li{counter-increment:step;font-size:.82rem;color:var(--text);margin-bottom:6px;padding-left:28px;position:relative;list-style:none;line-height:1.5}
.fb-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff}
.fb-steps li a{color:var(--accent);text-decoration:underline}
.fb-steps li code{background:#2a2a3e;padding:1px 6px;border-radius:4px;font-size:.78rem;font-family:monospace;color:var(--accent2)}
.fb-connected{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.fb-badge{background:#2a2a3e;border-radius:20px;padding:4px 12px;font-size:.82rem;color:var(--green);font-weight:600;border:1px solid var(--green)}
.fb-actions{display:flex;gap:8px;flex-wrap:wrap}
.sync-preview{margin-top:14px}
.sync-preview h4{font-size:.85rem;font-weight:700;margin-bottom:8px;color:var(--muted)}
.sync-item{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-item-check{flex-shrink:0}
.sync-item-meta{flex:1;min-width:120px}
.sync-item-meta .date{font-size:.8rem;color:var(--muted)}
.sync-item-meta .type{font-size:.78rem;background:#2a2a3e;border-radius:12px;padding:1px 8px;display:inline-block;margin-top:2px}
.sync-item-nums{display:flex;gap:10px;flex-wrap:wrap}
.sync-item-nums .mn{text-align:center}
.sync-item-nums .mv{font-size:.88rem;font-weight:700}
.sync-item-nums .mk{font-size:.7rem;color:var(--muted)}
.sync-save-bar{margin-top:10px;display:flex;gap:8px;align-items:center}
.fb-token-input{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.fb-token-input input{flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:.88rem;font-family:inherit}
.fb-token-input input:focus{outline:none;border-color:var(--accent)}
.info-box{background:var(--surface2);border-radius:10px;padding:12px}
.info-box .lb{font-size:.72rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.info-box .vl{font-size:.9rem;line-height:1.5}
.profile-header{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;flex-shrink:0}

/* ── Nine-grid (九宮格) ── */
.ninegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.ng-cell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;min-height:54px;display:flex;align-items:stretch}
.ng-cell input{width:100%;background:transparent;border:none;color:var(--text);padding:8px;font-size:.78rem;text-align:center;font-family:inherit}
.ng-cell input:focus{outline:none}
.ng-cell:focus-within{border-color:var(--accent)}
.ng-center{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:.74rem;font-weight:700;color:#fff;line-height:1.35}
.ng-readcell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:.76rem;line-height:1.35;color:var(--text)}
.ng-readcell.empty{color:var(--muted);opacity:.5}
.ng-hint{font-size:.74rem;color:var(--muted);margin:2px 0 10px;line-height:1.6}

/* ── Topics ── */
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s,transform .1s;margin-bottom:12px}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.topic-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.topic-hook{font-size:1rem;font-weight:600;line-height:1.5}
.regen-btn{width:100%;padding:11px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);cursor:pointer;font-size:.85rem;transition:all .15s;margin-top:4px}
.regen-btn:hover{border-color:var(--accent);color:var(--accent)}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.hist-head .section-title{margin:0}
.hist-clear{background:none;border:none;color:var(--muted);font-size:.74rem;cursor:pointer;padding:2px 4px}
.hist-clear:hover{color:#ef4444}
.hist-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s;margin-bottom:8px}
.hist-item:hover{border-color:var(--accent)}
.hist-item .hi-main{flex:1;min-width:0}
.hist-item .hi-hook{font-size:.88rem;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .hi-meta{font-size:.7rem;color:var(--muted);margin-top:3px}
.hist-item .hi-date{font-size:.7rem;color:var(--muted);flex-shrink:0}
.hist-empty{color:var(--muted);font-size:.8rem;text-align:center;padding:16px 0}

/* ── Detail overlay ── */
#detail-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:20px 16px 80px}
#detail-overlay.open{display:block}
.detail-inner{max-width:820px;margin:0 auto}
.detail-back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;margin-bottom:16px;padding:4px 0}
.detail-back:hover{color:var(--text)}
.hook-box{background:var(--surface2);border-left:3px solid var(--accent);padding:14px 16px;border-radius:0 8px 8px 0;font-size:1rem;font-weight:600;line-height:1.5}
.structure{counter-reset:step;list-style:none}
.structure li{counter-increment:step;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.88rem;line-height:1.5}
.structure li:last-child{border-bottom:none}
.structure li::before{content:counter(step);background:var(--accent);color:#fff;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:2px}
.script-box{background:#1a1a2e;border:1px solid #3d2a5e;border-radius:10px;padding:16px;font-size:.88rem;line-height:1.9;white-space:pre-wrap}
.timing{font-size:.75rem;color:#b89af7;margin-bottom:8px}
.caption-box{background:var(--surface2);border-radius:8px;padding:14px;font-size:.88rem;line-height:1.7;white-space:pre-wrap}
.cta-row{display:flex;gap:8px;flex-wrap:wrap}
.cta-pill{background:#2a2a3e;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.82rem}
.save-ok{color:var(--green);opacity:0;transition:opacity .3s;font-size:.78rem}
.save-ok.show{opacity:1}
textarea.ea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:.88rem;line-height:1.6;resize:vertical;min-height:120px;font-family:inherit}
textarea.ea:focus{outline:none;border-color:var(--accent)}

/* ── Advice ── */
.perf-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.perf-form{grid-template-columns:1fr}}
.mi label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:4px}
.mi input,.mi select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:.9rem;font-family:inherit}
.advice-card{background:linear-gradient(135deg,#1e1a3a,#2a1a2e);border:1px solid #3d2a5e;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.advice-card h3{font-size:.85rem;color:#b89af7;margin-bottom:8px}
.advice-card ul{list-style:none}
.advice-card ul li{font-size:.85rem;padding:3px 0;line-height:1.6}
.advice-card ul li::before{content:"→ ";color:var(--accent)}
.bm-table{width:100%;border-collapse:collapse;font-size:.82rem}
.bm-table th{text-align:left;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
.bm-table td{padding:7px 8px;border-bottom:1px solid var(--border)}
.bm-table tr:last-child td{border-bottom:none}
.good{color:var(--green)}.warn{color:#f6c90e}.bad{color:var(--accent2)}
.ph-item{background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:8px;font-size:.83rem}
.ph-meta{color:var(--muted);font-size:.75rem;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap}
.ph-metrics{display:flex;gap:12px;flex-wrap:wrap}
.pm .v{font-weight:700;font-size:.95rem}.pm .k{font-size:.68rem;color:var(--muted);text-align:center}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:.88rem}

/* ── Toast ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;white-space:nowrap}
#toast.show{opacity:1}

/* ── Loading splash ── */
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOADING (hidden by default; only shown briefly when restoring session) -->
<div id="loading-screen" style="display:none">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:.85rem">載入中…</div>
</div>

<!-- AUTH (shown by default) -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>IG Agent 🤖</h1>
    <p>你的 IG 內容工廠 · 登入開始使用</p>
    <div id="au-err" class="err" style="margin-bottom:8px"></div>
    <button class="btn-google" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.1-6.1C34.46 3.19 29.53 1 24 1 14.82 1 7.07 6.48 3.69 14.22l7.12 5.53C12.6 13.62 17.85 9.5 24 9.5z"/><path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.74H24v8.97h12.67c-.55 2.94-2.2 5.43-4.68 7.1l7.16 5.56C43.18 37.56 46.52 31.52 46.52 24.5z"/><path fill="#FBBC05" d="M10.81 28.25A14.54 14.54 0 0 1 9.5 24c0-1.47.25-2.9.69-4.25L3.07 14.22A23.93 23.93 0 0 0 0 24c0 3.87.93 7.53 2.58 10.77l8.23-6.52z"/><path fill="#34A853" d="M24 47c5.53 0 10.17-1.84 13.56-4.97l-7.16-5.56c-1.99 1.34-4.53 2.13-6.4 2.13-6.15 0-11.4-4.12-13.19-9.75l-8.23 6.52C7.07 41.52 14.82 47 24 47z"/></svg>
      使用 Google 帳號登入
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="logo">IG Agent</div>
    <span class="handle" id="top-handle"></span>
    <button class="signout" onclick="doSignOut()">登出</button>
  </div>
  <div class="page-wrap" id="page-profile" style="display:none"></div>
  <div class="page-wrap" id="page-topics"  style="display:none"></div>
  <div class="page-wrap" id="page-advice"  style="display:none"></div>
  <div class="page-wrap" id="page-score"   style="display:none"></div>
  <nav class="bottom-nav">
    <div class="nav-item" id="nav-profile" onclick="showPage('profile')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>定位
    </div>
    <div class="nav-item" id="nav-topics" onclick="showPage('topics')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>每日主題
    </div>
    <div class="nav-item" id="nav-advice" onclick="showPage('advice')">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>流量建議
    </div>
    <div class="nav-item" id="nav-score" onclick="showPage('score')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>評分
    </div>
  </nav>
</div>

<!-- DETAIL OVERLAY -->
<div id="detail-overlay">
  <div class="detail-inner">
    <button class="detail-back" onclick="closeDetail()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>返回主題
    </button>
    <div id="detail-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── UTILS (must be first — onAuthStateChange fires synchronously) ───
const id=x=>document.getElementById(x);
const v=x=>id(x)?.value.trim()||'';
const n=x=>parseInt(id(x)?.value)||0;

// ─── CAPTURE FB OAUTH TOKEN BEFORE SUPABASE INIT ───
// Must run before supabase.createClient() so Supabase doesn't misread
// Facebook's access_token from the hash as a Supabase session.
(function(){
  try{
    const p=new URLSearchParams(location.hash.replace('#',''));
    const st=sessionStorage.getItem('fb_oauth_state');

// ─── STYLE ANALYSIS ───
function analyzeStyle(){
  const texts=Object.values(styleRecords);
  if(texts.length<2) return null;
  const all=texts.join('\n');
  const casual=(all.match(/哈|笑死|真的|超|根本|欸|啊/g)||[]).length;
  const emojis=(all.match(/[\u{1F300}-\u{1FAFF}]/gu)||[]).length;
  const bullets=(all.match(/^[→•\-\*]/gm)||[]).length;
  return{
    tone:casual>4?'口語親切':bullets>5?'清單條列':'知識型深度',
    emojiFreq:emojis>8?'大量':emojis>2?'適度':'少用',
    editCount:texts.length
  };
}

// ── Nine-grid (九宮格) definitions ──
const GRID1_CENTER='你的身份最常接觸事物';
const GRID2_CENTER='觀眾、受眾的煩惱問題';

// Build an editable 3x3 nine-grid: 8 inputs around a fixed center label.
function nineGridInput(prefix,centerLabel,values=[]){
  const v=Array.from({length:8},(_,i)=>values[i]||'');
  const cell=i=>`<div class="ng-cell"><input id="${prefix}-${i}" value="${(v[i]||'').replace(/"/g,'&quot;')}" placeholder="—"></div>`;
  return`<div class="ninegrid">
    ${cell(0)}${cell(1)}${cell(2)}
    ${cell(3)}<div class="ng-center">${centerLabel}</div>${cell(4)}
    ${cell(5)}${cell(6)}${cell(7)}
  </div>`;
}

// Build a read-only nine-grid for the profile display.
function nineGridDisplay(centerLabel,values=[]){
  const v=Array.from({length:8},(_,i)=>values[i]||'');
  const cell=i=>`<div class="ng-readcell${v[i]?'':' empty'}">${v[i]||'—'}</div>`;
  return`<div class="ninegrid">
    ${cell(0)}${cell(1)}${cell(2)}
    ${cell(3)}<div class="ng-center">${centerLabel}</div>${cell(4)}
    ${cell(5)}${cell(6)}${cell(7)}
  </div>`;
}

// Read 8 values out of a nine-grid input by prefix.
function readNineGrid(prefix){
  return Array.from({length:8},(_,i)=>{const el=document.getElementById(`${prefix}-${i}`);return el?el.value.trim():'';});
}

// Record a topic as "selected" (dedupe by hook, newest first).
async function recordSelectedTopic(t){
  if(!t||!t.hook||!currentUser) return;
  selectedTopics=selectedTopics.filter(x=>x.hook!==t.hook);
  selectedTopics.unshift({hook:t.hook,theme:t.theme,style:t.style,format:t.format,selected_at:new Date().toISOString()});
  if(selectedTopics.length>30) selectedTopics=selectedTopics.slice(0,30);
  try{
    await sb.from('ig_selected_topics').delete().eq('user_id',currentUser.id).eq('hook',t.hook);
    await sb.from('ig_selected_topics').insert({user_id:currentUser.id,hook:t.hook,theme:t.theme||null,style:t.style||null,format:t.format||null});
  }catch{}
}

function fbStartOAuth(){
  const state='fb_'+Math.random().toString(36).substr(2,9);
  sessionStorage.setItem('fb_oauth_state',state);
  const params=new URLSearchParams({
    client_id: FB_APP_ID,
    redirect_uri: 'https://ptgaminglife.github.io/IGagent/',
    response_type: 'token',
    state: state
  });
  // Business-type apps use Facebook Login for Business: requires config_id, scope is rejected
  if(FB_CONFIG_ID) params.set('config_id',FB_CONFIG_ID);
  else params.set('scope','pages_show_list,pages_read_engagement,instagram_basic,instagram_manage_insights');
  location.href=`https://www.facebook.com/v22.0/dialog/oauth?${params.toString()}`;
}

async function fbGetIGAccount(userToken){
  const msg=id('fb-connect-msg');
  try{
    // Step 1: get FB pages (page token has more permissions than user token)
    const r=await fetch(`https://graph.facebook.com/v22.0/me/accounts?fields=id,name,access_token,instagram_business_account&access_token=${userToken}`);
    const d=await r.json();
    if(d.error) throw new Error(d.error.message);
    const page=(d.data||[]).find(p=>p.instagram_business_account);
    if(!page) throw new Error('找不到連結 IG 的粉絲專頁。請確認你的 IG 帳號已在「Instagram 設定 → 帳號 → 連結的帳號」連結到 Facebook 粉絲專頁');

    // Step 2: get IG username
    const igId=page.instagram_business_account.id;
    const r2=await fetch(`https://graph.facebook.com/v22.0/${igId}?fields=username,followers_count&access_token=${page.access_token}`);
    const ig=await r2.json();
    if(ig.error) throw new Error(ig.error.message);

    localStorage.setItem('ig_fb_page_token',page.access_token);
    localStorage.setItem('ig_fb_ig_uid',igId);
    localStorage.setItem('ig_fb_ig_name',ig.username||igId);

    toast('成功連結 @'+(ig.username||igId)+' ✓');
    renderAdvice();
  }catch(e){
    if(msg) msg.textContent='';
    toast('連結失敗：'+e.message,true);
    console.error(e);
  }
}

async function fbSyncPosts(){
  const s=fbState();
  if(!s.token||!s.uid){toast('請先連結 IG 帳號',true);return;}
  const btn=id('fb-sync-btn');
  if(btn){btn.disabled=true;btn.textContent='同步中…';}
  const preview=id('sync-preview');
  if(preview) preview.innerHTML='<div style="color:var(--muted);font-size:.82rem;padding:8px 0">正在從 Instagram Graph API 取得數據…</div>';

  try{
    // Fetch recent 10 media
    const mUrl=`https://graph.facebook.com/v22.0/${s.uid}/media?fields=id,media_type,media_product_type,timestamp,like_count,comments_count&limit=10&access_token=${s.token}`;
    const mr=await fetch(mUrl);
    const md=await mr.json();
    if(md.error){
      if(md.error.code===190||md.error.type==='OAuthException'){fbTokenExpired();return;}
      throw new Error(md.error.message);
    }

    const posts=md.data||[];
    if(!posts.length){if(preview)preview.innerHTML='<div style="color:var(--muted);font-size:.82rem">沒有找到貼文數據</div>';return;}

    // Fetch insights for each post
    const synced=[];
    for(const post of posts){
      const isReel=post.media_product_type==='REELS';
      const isStory=post.media_type==='STORY'||post.media_product_type==='STORY';
      const isCarousel=post.media_type==='CAROUSEL_ALBUM';
      const metrics=isReel?'plays,reach,saved,shares':isStory?'impressions,reach':'impressions,reach,saved,shares';

      let views=0,saves=0,shares=0;
      try{
        const ir=await fetch(`https://graph.facebook.com/v22.0/${post.id}/insights?metric=${metrics}&period=lifetime&access_token=${s.token}`);
        const ins=await ir.json();
        if(!ins.error&&ins.data){
          for(const m of ins.data){
            const val=m.values?.[0]?.value||m.value||0;
            if(m.name==='plays'||m.name==='impressions') views=val;
            if(m.name==='saved') saves=val;
            if(m.name==='shares') shares=val;
          }
        }
      }catch(e){}

      synced.push({
        _media_id: post.id,
        post_type: isReel?'Reel':isCarousel?'輪播':isStory?'限動':'單圖',
        post_date: post.timestamp.split('T')[0],
        views, likes:post.like_count||0, saves, shares,
        dms:0, comments:post.comments_count||0,
        notes:'FB Graph API 同步'
      });
    }

    if(preview) preview.innerHTML=buildSyncPreview(synced);

  }catch(e){
    if(preview) preview.innerHTML='';
    toast('同步失敗：'+e.message,true);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='同步最近 10 篇貼文';}
  }
}

      <div class="sync-item-meta">
        <div class="date">📅 ${p.post_date}</div>

}

// posts count trick: read checkbox states and reconstruct from DOM
async function fbSavePosts(count){
  const toSave=[];

  const items=document.querySelectorAll('.sync-item');
  items.forEach((el,i)=>{

    // Read metrics from the .mv spans
    const mvs=[...el.querySelectorAll('.mv')];

    const date=el.querySelector('.date')?.textContent?.replace('📅 ','').trim();
    const type=el.querySelector('.type')?.textContent?.trim();
    toSave.push({
      user_id:currentUser.id,
      post_date:date,post_type:type,
      views:map['觀看']||0,likes:map['讚']||0,saves:map['收藏']||0,
      shares:map['分享']||0,dms:0,comments:map['留言']||0,
      notes:'FB Graph API 同步'
    });
  });

  if(!toSave.length){toast('請至少勾選一篇',true);return;}
  const{error}=await sb.from('ig_performance').insert(toSave);

function buildAdvice(){
  if(!perfData.length) return`<div class="advice-card"><h3>💡 開始記錄你的流量數據</h3><ul>
    <li>新增至少 3 筆貼文數據後，系統會分析你的帳號表現</li>
    <li>2026 年演算法最重視：觀看時長 → DMs → 分享 → 收藏 → 按讚</li>
    <li>健康互動率參考（1K–10K 粉絲）：11% 以上為優良</li></ul></div>`;

  const n=perfData.length;
  const tot=(k)=>perfData.reduce((s,r)=>s+(r[k]||0),0);
  const views=tot('views'),saves=tot('saves'),shares=tot('shares'),dms=tot('dms'),likes=tot('likes'),comments=tot('comments');
  const avgV=Math.round(views/n);
  const eng=views>0?(((saves+shares+dms+likes+comments)/views)*100).toFixed(1):0;
  const saveR=views>0?((saves/views)*100).toFixed(1):0;
  const shareR=views>0?((shares/views)*100).toFixed(1):0;

  const byFmt={};
  perfData.forEach(r=>{const f=r.post_type||'其他';if(!byFmt[f]){byFmt[f]={c:0,v:0};}byFmt[f].c++;byFmt[f].v+=r.views||0;});
  const best=Object.entries(byFmt).sort((a,b)=>b[1].v/b[1].c-a[1].v/a[1].c)[0];

  const tips=[];
  if(saveR<2) tips.push('收藏率偏低（'+saveR+'%）── 試試「清單型」或「行動指南」，提高工具性價值');
  else tips.push('收藏率不錯（'+saveR+'%）── 繼續製作「清單型」和「行動指南」內容');
  if(shareR<1) tips.push('分享率偏低（'+shareR+'%）── 試試「反向思考」或「故事共鳴」，提升社交貨幣感');
  else tips.push('分享率健康（'+shareR+'%）── 反骨型和共鳴型內容對你很有效，多做');
  if(dms<n*0.5) tips.push('DM 互動偏少 ── 在 Caption 結尾加入「DM 我取得⋯」的 CTA，提升最高權重訊號');
  else tips.push('DM 互動良好 ── 這是 2026 最高權重訊號，每篇都設計 DM CTA，繼續保持');
  if(eng<5) tips.push(`整體互動率 ${eng}% 偏低 ── 優化 Hook 前 3 秒，或嘗試「痛點式開場」`);
  else tips.push(`整體互動率 ${eng}% 表現良好 👏`);

  return`
    <div class="advice-card">
      <h3>📈 帳號表現摘要（近 ${n} 筆）</h3>
      <table class="bm-table">
        <tr><th>指標</th><th>數值</th><th>2026 基準</th><th>狀態</th></tr>
        <tr><td>平均觀看</td><td>${avgV.toLocaleString()}</td><td>—</td><td>—</td></tr>
        <tr><td>互動率</td><td>${eng}%</td><td>&gt;11%（1K–10K）</td><td class="${eng>=11?'good':eng>=6?'warn':'bad'}">${eng>=11?'✅ 優良':eng>=6?'⚠️ 待改善':'❌ 需優化'}</td></tr>
        <tr><td>收藏率</td><td>${saveR}%</td><td>&gt;2%</td><td class="${saveR>=2?'good':'bad'}">${saveR>=2?'✅':'❌'}</td></tr>
        <tr><td>分享率</td><td>${shareR}%</td><td>&gt;1%</td><td class="${shareR>=1?'good':'bad'}">${shareR>=1?'✅':'❌'}</td></tr>
        ${best?`<tr><td>最佳格式</td><td colspan="3" class="good">📌 ${best[0]}（均 ${Math.round(best[1].v/best[1].c).toLocaleString()} 觀看）</td></tr>`:''}
      </table>
    </div>
    <div class="advice-card">
      <h3>🎯 個人化建議</h3><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
    <div class="advice-card">
      <h3>🗓️ 本週內容建議組合</h3><ul>
        <li>${saveR<2?'多做 1 篇「清單型」內容衝收藏率':'繼續 1 篇高收藏內容維持帳號權重'}</li>
        <li>${shareR<1?'加入 1 篇「反骨型 Reels」刺激分享':'保持 1 篇反骨觀點內容'}</li>
        <li>${dms<n*0.5?'每篇 Caption 末尾加 DM CTA，建立私訊習慣':'DM CTA 表現不錯，維持節奏'}</li>
      </ul>
    </div>`;
}

// ─── SCORING ENGINE ───
function scoreScript(text){
  const t=text.trim();
  if(!t) return null;
  const lines=t.split(/\n/).map(l=>l.trim()).filter(l=>l.length>0);
  const firstLine=lines[0]||'';
  const allText=t.toLowerCase();
  const charCount=t.length;
  const wordCount=t.replace(/[^一-龥a-zA-Z]/g,'').length;

  // ── DIM 1: Hook 強度 (25pt) ──
  let hookScore=0; const hookFb=[];
  const hookPatterns=[
    {re:/你是不是|你有沒有|你是否|你還在|有多少人/,pts:5,label:'問題式 Hook'},
    {re:/停止|不要再|別再|你錯了|大錯特錯|你一直|你以為/,pts:5,label:'否定/反向型 Hook'},
    {re:/\d+%|\d+倍|\d+天|\d+秒|\d+步|\d+個|\d+萬/,pts:5,label:'具體數字型 Hook'},
    {re:/我發現|沒有人告訴你|大多數人不知道|90%|85%|秘密/,pts:5,label:'好奇心型 Hook'},
    {re:/以前.*現在|從.*到.*只需|花了.*現在只/,pts:5,label:'對比型 Hook'},
    {re:/POV|你的.*死了|比你想像.*糟|準備好|不要看這/,pts:4,label:'衝擊型 Hook'},
  ];
  let hookMatched=false;
  for(const p of hookPatterns){
    if(p.re.test(firstLine)||p.re.test(lines.slice(0,2).join(''))){
      hookScore+=p.pts; hookFb.push({type:'good',msg:`檢測到「${p.label}」`}); hookMatched=true; break;
    }
  }
  if(!hookMatched){hookFb.push({type:'bad',msg:'開場未使用任何公認 Hook 公式，前 3 秒吸引力弱'});}
  // Hook 長度（首行≤20字效果最佳）
  const firstLineLen=firstLine.replace(/[^一-龥a-zA-Z0-9]/g,'').length;
  if(firstLineLen<=20&&firstLineLen>0){hookScore+=8;hookFb.push({type:'good',msg:`開場句 ${firstLineLen} 字，符合 15-20 字黃金法則`});}
  else if(firstLineLen>20&&firstLineLen<=35){hookScore+=4;hookFb.push({type:'warn',msg:`開場句 ${firstLineLen} 字，建議壓縮到 20 字內`});}
  else if(firstLineLen>35){hookFb.push({type:'bad',msg:`開場句 ${firstLineLen} 字過長，IG 介面會被「閱讀更多」截斷`});}
  // 問題=-hook 心理模型
  if(/[？?]/.test(firstLine)){hookScore+=7;hookFb.push({type:'good',msg:'以問句開場，觸發大腦解決機制（問題＝-hook 心理模型）'});}
  else if(hookScore>0){hookScore+=4;}
  hookScore=Math.min(25,hookScore);

  // ── DIM 2: 演算法適配 (20pt) ──
  let algoScore=0; const algoFb=[];
  // SEO 關鍵字密度
  const seoWords=['AI','人工智能','自動化','效率','健康','流量','漲粉','工具','方法','技巧','系統','策略','變現','收入'];
  const seoHits=seoWords.filter(w=>allText.includes(w.toLowerCase()));
  if(seoHits.length>=3){algoScore+=6;algoFb.push({type:'good',msg:`含 ${seoHits.length} 個 IG SEO 關鍵字（${seoHits.slice(0,3).join('、')}…），有助興趣圖譜匹配`});}
  else if(seoHits.length>=1){algoScore+=3;algoFb.push({type:'warn',msg:`僅含 ${seoHits.length} 個 SEO 關鍵字，建議增加到 3+ 個`});}
  else{algoFb.push({type:'bad',msg:'缺乏 IG SEO 關鍵字，演算法難以匹配興趣圖譜'});}
  // 高權重互動訊號
  const dmSignal=/私訊|dm|DM|傳訊息給我|留言.*告訴我/.test(allText);
  const shareSignal=/分享給|轉發|Tag.*朋友|傳給/.test(allText);
  const saveSignal=/收藏|儲存|存起來|先收藏/.test(allText);
  if(dmSignal){algoScore+=7;algoFb.push({type:'good',msg:'含 DM 引導（2026 最高權重訊號）'});}
  else if(shareSignal){algoScore+=5;algoFb.push({type:'good',msg:'含分享引導（2026 高權重訊號）'});}
  else if(saveSignal){algoScore+=4;algoFb.push({type:'warn',msg:'含收藏引導，但 DM/分享權重更高'});}
  else{algoFb.push({type:'bad',msg:'缺乏高權重互動引導（DM/分享/收藏），演算法訊號弱'});}
  // 完播率設計（每行帶動下一行）
  const hasCliffhanger=/原因是|因為|但是|然而|不過|接下來|重點來了|最關鍵的是/.test(allText);
  if(hasCliffhanger){algoScore+=4;algoFb.push({type:'good',msg:'含「行間推動力」詞語，有助提升觀看完成率'});}
  else{algoFb.push({type:'warn',msg:'缺乏引導繼續閱讀的過渡詞，完播率可能偏低'});}
  // 長度適配
  if(wordCount>=80&&wordCount<=200){algoScore+=3;algoFb.push({type:'good',msg:`${wordCount} 字，符合 60s Reel 腳本長度（80-200 字）`});}
  else if(wordCount<80){algoFb.push({type:'warn',msg:`${wordCount} 字偏短，內容可能不夠豐富`});}
  else{algoFb.push({type:'warn',msg:`${wordCount} 字偏長，建議精簡以提升完播率`});}
  algoScore=Math.min(20,algoScore);

  // ── DIM 3: 內容結構 (20pt) ──
  let structScore=0; const structFb=[];
  // 四段結構檢測：開場/問題/解法/CTA
  const hasOpening=lines.length>0;
  const hasProblem=/問題|挑戰|困難|痛點|掙扎|苦惱|一直.*沒|為什麼.*不/.test(allText);
  const hasSolution=/方法|步驟|解決|做法|技巧|訣竅|這樣做|其實你/.test(allText);
  const hasCTA=/留言|收藏|分享|私訊|追蹤|點擊|DM|dm|儲存/.test(allText);
  if(hasOpening) structScore+=3;
  if(hasProblem){structScore+=5;structFb.push({type:'good',msg:'有明確痛點描述（問題段）'});}
  else{structFb.push({type:'warn',msg:'缺少明確痛點/問題描述，共情感弱'});}
  if(hasSolution){structScore+=6;structFb.push({type:'good',msg:'有解決方案或方法論（解法段）'});}
  else{structFb.push({type:'bad',msg:'缺少可執行的解決方案，內容價值偏低'});}
  if(hasCTA){structScore+=4;structFb.push({type:'good',msg:'有明確行動號召（CTA）'});}
  else{structFb.push({type:'bad',msg:'缺少 CTA，錯失互動機會'});}
  // 段落數量
  if(lines.length>=4&&lines.length<=12){structScore+=2;structFb.push({type:'good',msg:`${lines.length} 行結構清晰，節奏合適`});}
  else if(lines.length>12){structFb.push({type:'warn',msg:`${lines.length} 行略多，可精簡冗餘段落`});}
  structScore=Math.min(20,structScore);

  // ── DIM 4: 留存設計 (15pt) ──
  let retentionScore=0; const retentionFb=[];
  // 工具價值（讓人收藏）
  const hasUtility=/步驟|清單|工具|模板|公式|框架|方法|教學|指南|怎麼做/.test(allText);
  if(hasUtility){retentionScore+=5;retentionFb.push({type:'good',msg:'具備工具性價值（清單/步驟/公式），驅動收藏行為'});}
  else{retentionFb.push({type:'warn',msg:'缺乏工具性價值，收藏動機低'});}
  // 社交貨幣（讓人分享）
  const hasSocialCurrency=/大多數人.*不知道|你的朋友|身邊.*人|竟然|原來|震驚|沒想到|改變了我|一定要分享/.test(allText);
  if(hasSocialCurrency){retentionScore+=5;retentionFb.push({type:'good',msg:'含社交貨幣元素，驅動分享行為'});}
  else{retentionFb.push({type:'warn',msg:'缺乏社交貨幣，分享動機低（建議加入「你的朋友一定也需要」類語句）'});}
  // 心理需求：勝任感
  const hasCompetence=/學會|掌握|變強|提升|升級|懂得|原來如此/.test(allText);
  if(hasCompetence){retentionScore+=3;retentionFb.push({type:'good',msg:'讓讀者有「我變強了」的勝任感（SDT 勝任感需求）'});}
  // 擬人化/口語
  const isConversational=/我|你|我們|哈|欸|對啊|其實|說真的|老實說/.test(allText);
  if(isConversational){retentionScore+=2;retentionFb.push({type:'good',msg:'語氣口語化，建立關聯感（SDT 關聯感需求）'});}
  else{retentionFb.push({type:'warn',msg:'語氣偏書面，建議增加口語化表達'});}
  retentionScore=Math.min(15,retentionScore);

  // ── DIM 5: CTA 設計 (10pt) ──
  let ctaScore=0; const ctaFb=[];
  const ctaDM=/私訊|dm我|DM我|傳訊|傳 我/.test(allText);
  const ctaShare=/分享給|轉傳|Tag.*朋友|傳給朋友/.test(allText);
  const ctaSave=/收藏|儲存起來/.test(allText);
  const ctaComment=/留言|評論|告訴我/.test(allText);
  const ctaFollow=/追蹤|關注/.test(allText);
  const ctaCount=[ctaDM,ctaShare,ctaSave,ctaComment,ctaFollow].filter(Boolean).length;
  if(ctaDM){ctaScore+=8;ctaFb.push({type:'good',msg:'DM 引導（2026 最高權重 CTA，代表強烈用戶關係強度）'});}
  else if(ctaShare){ctaScore+=7;ctaFb.push({type:'good',msg:'分享引導（2026 高權重，接觸陌生流量引擎）'});}
  else if(ctaSave){ctaScore+=5;ctaFb.push({type:'good',msg:'收藏引導（內容長尾價值訊號）'});}
  else if(ctaComment){ctaScore+=4;ctaFb.push({type:'good',msg:'留言引導（+1 機制可提升互動權重）'});}
  else if(ctaFollow){ctaScore+=2;ctaFb.push({type:'warn',msg:'追蹤引導對演算法訊號幫助有限'});}
  else{ctaFb.push({type:'bad',msg:'完全沒有 CTA，嚴重浪費互動機會'});}
  // 單一 CTA 加分
  if(ctaCount===1){ctaScore+=2;ctaFb.push({type:'good',msg:'只有一個 CTA，符合「單一行動原則」'});}
  else if(ctaCount>2){ctaFb.push({type:'warn',msg:`${ctaCount} 個 CTA 過多，分散行動意願，建議只保留最高權重的一個`});}
  ctaScore=Math.min(10,ctaScore);

  // ── DIM 6: 差異化 (10pt) ──
  let diffScore=10; const diffFb=[];
  const saturatedPatterns=[
    {re:/成功的秘訣|成功人士|致富|逆襲|翻轉人生/,label:'過度包裝成功學'},
    {re:/根據研究.*(?!但|然而)|理論上|學術上.*告訴我們(?!但)/,label:'純理論分享（缺乏實操感）'},
    {re:/點擊連結|購買|優惠|限時|折扣/,label:'推銷感過重'},
    {re:/^今天我要.*分享|^大家好.*今天|^嗨大家好/,label:'拖沓的制式開場'},
    {re:/如果你喜歡.*記得|喜歡.*按個讚.*追蹤/,label:'封閉式敘事（缺乏社交貨幣）'},
  ];
  for(const p of saturatedPatterns){
    if(p.re.test(allText)){diffScore-=2;diffFb.push({type:'bad',msg:`檢測到「${p.label}」飽和模式，建議改寫`});}
  }
  // 加分：contrarian 或獨特觀點
  const hasContrarian=/其實.*錯了|大家都說.*但|主流做法.*問題|停止.*開始|不需要.*需要/.test(allText);
  if(hasContrarian){diffScore=Math.min(10,diffScore+2);diffFb.push({type:'good',msg:'含反向思考（Contrarian）元素，高參與度潛力'});}
  if(diffFb.length===0){diffFb.push({type:'good',msg:'未檢測到飽和模式，差異化程度良好'});}
  diffScore=Math.max(0,Math.min(10,diffScore));

  const total=hookScore+algoScore+structScore+retentionScore+ctaScore+diffScore;
  const grade=total>=85?'S 爆款潛力':total>=70?'A 高流量':total>=55?'B 正常水準':total>=40?'C 需優化':'D 需重寫';
  const gradeClass=total>=85?'grade-s':total>=70?'grade-a':total>=55?'grade-b':total>=40?'grade-c':'grade-d';

  return{total,grade,gradeClass,dims:[
    {name:'Hook 強度',pts:hookScore,max:25,fb:hookFb},
    {name:'演算法適配',pts:algoScore,max:20,fb:algoFb},
    {name:'內容結構',pts:structScore,max:20,fb:structFb},
    {name:'留存設計',pts:retentionScore,max:15,fb:retentionFb},
    {name:'CTA 設計',pts:ctaScore,max:10,fb:ctaFb},
    {name:'差異化',pts:diffScore,max:10,fb:diffFb},
  ]};
}

function buildScoreHTML(result){
  if(!result) return'';
  const barColor=pts=>pts/100>0.8?'var(--green)':pts/100>0.55?'var(--accent)':'var(--accent2)';
  const pct=(pts,max)=>Math.round(pts/max*100);
  const fbHTML=items=>items.map(f=>`<span class="${f.type}">${f.type==='good'?'✓':f.type==='warn'?'△':'✗'} ${f.msg}</span>`).join('<br>');

  const bars=result.dims.map(d=>`
    <div class="score-bar-row">
      <div class="score-bar-label">${d.name}</div>
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct(d.pts,d.max)}%;background:${barColor(pct(d.pts,d.max)/100)}"></div></div>
      <div class="score-bar-pts" style="color:${barColor(pct(d.pts,d.max)/100)}">${d.pts}/${d.max}</div>
    </div>`).join('');

  const dims=result.dims.map(d=>`
    <div class="score-dim">
      <div class="score-dim-head">
        <span class="score-dim-name">${d.name}</span>
        <span class="score-dim-pts" style="color:${barColor(pct(d.pts,d.max)/100)}">${d.pts} / ${d.max} 分</span>
      </div>
      <div class="score-feedback">${fbHTML(d.fb)}</div>
    </div>`).join('');

  const improveItems=result.dims
    .filter(d=>d.pts/d.max<0.7)
    .flatMap(d=>d.fb.filter(f=>f.type!=='good').map(f=>`<li>【${d.name}】${f.msg}</li>`))
    .join('');

  const improveSec=improveItems?`
    <div class="score-improve">
      <h4>🔧 優化建議</h4>
      <ul>${improveItems}</ul>
    </div>`:'<div class="score-improve"><h4>🎉 整體表現優異！</h4><ul><li>稿子已符合大多數高流量要素，可直接發佈。</li></ul></div>';

  return`
    <div class="score-dial">
      <div class="total">${result.total}</div>
      <div class="grade ${result.gradeClass}">${result.grade}</div>
    </div>
    <div>${bars}</div>
    <div class="score-detail">${dims}</div>
    ${improveSec}
    <div class="score-src-badge">
      <span>2026 IG 演算法</span><span>Justin Welsh 內容矩陣</span><span>Hook 心理模型</span><span>SDT 自我決定理論</span>
    </div>`;
}

}

function runScore(){
  const text=id('score-text')?.value||'';
  if(!text.trim()){toast('請先輸入或貼上稿件文字',true);return;}
  const result=scoreScript(text);
  id('score-result').innerHTML=buildScoreHTML(result);
}
</script>
